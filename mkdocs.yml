site_name: PyDB
site_description: "Build your own SQL database in Python: tables, joins, B-tree indexes, a query planner and transactions, explained for learners."
site_url: https://robcox2910.github.io/pydb/

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

nav:
  - Home: index.md
  - Concepts:
    - Records: concepts/records.md
    - Schema: concepts/schema.md
    - Tables: concepts/tables.md
    - Serializer: concepts/serializer.md
    - Storage Engine: concepts/storage-engine.md
    - Database: concepts/database.md
    - Indexes: concepts/indexes.md
    - Query Engine: concepts/query-engine.md
    - SQL Parser: concepts/sql-parser.md
    - JOINs: concepts/joins.md
    - Aggregations: concepts/aggregations.md
    - Query Planner: concepts/query-planner.md
    - Constraints: concepts/constraints.md
    - NULL: concepts/null.md
    - Subqueries: concepts/subqueries.md
    - Views: concepts/views.md
    - Transactions: concepts/transactions.md
    - REPL: concepts/repl.md
    - CSV Import/Export: concepts/csv.md
    - Write-Ahead Log: concepts/wal.md
    - MVCC: concepts/mvcc.md
  - Durable Databases:
    - Dates and Times: concepts/dates-and-times.md
    - The Journal: concepts/journal.md
    - Crash Recovery: concepts/crash-recovery.md
    - Checkpoints: concepts/checkpoints.md
    - Torn Writes: concepts/torn-writes.md
    - Locks and Threads: concepts/locks-and-threads.md
    - The Outbox: concepts/outbox.md
  - Property Testing: property-testing.md
  # series-nav:start
  - The series:
      - Series home: https://robcox2910.github.io/
      - PyOS: https://robcox2910.github.io/py-os/
      - Pebble: https://robcox2910.github.io/pebble-lang/
      - "[You are here] PyDB": https://robcox2910.github.io/pydb/
      - PyKV: https://robcox2910.github.io/pykv/
      - PyDocDB: https://robcox2910.github.io/pydoc-db/
      - PyGraphDB: https://robcox2910.github.io/pygraphdb/
      - PyTSDB: https://robcox2910.github.io/pytsdb/
      - PyVecDB: https://robcox2910.github.io/pyvecdb/
      - PyColDB: https://robcox2910.github.io/pycoldb/
      - PyCrypt: https://robcox2910.github.io/pycrypt/
      - PyNet: https://robcox2910.github.io/pynet/
      - PyWeb: https://robcox2910.github.io/pyweb/
      - PyGit: https://robcox2910.github.io/pygit/
      - PySearch: https://robcox2910.github.io/pysearch/
      - PyMQ: https://robcox2910.github.io/pymq/
      - PyLLM: https://robcox2910.github.io/pyllm/
      - PyScheduler: https://robcox2910.github.io/pyscheduler/
      - PyStack: https://robcox2910.github.io/pystack/
  # series-nav:end

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true

exclude_docs: |
  superpowers/
