[project]
name = "pydb"
dynamic = ["version"]
description = "An educational database engine built from scratch in Python"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    { name = "Rob Cox" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Database",
    "Typing :: Typed",
]
keywords = ["database", "sql", "storage-engine", "education", "learning"]
dependencies = []

[project.urls]
Homepage = "https://github.com/robcox2910/pydb"
Repository = "https://github.com/robcox2910/pydb"
Issues = "https://github.com/robcox2910/pydb/issues"
Documentation = "https://robcox2910.github.io/pydb/"

[project.scripts]
pydb = "pydb.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.9.3",
    "pre-commit>=4.0.1",
    "pyright>=1.1.400",
    "commitizen>=4.4.0",
    "pip-audit>=2.10.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pydb/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydb"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
exclude = ["src/pydb/_version.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "C90",
    "PTH",
    "SIM",
    "TID",
    "S",
    "PERF",
    "FURB",
    "PIE",
    "T10",
    "T20",
    "ERA",
    "PL",
    "RET",
    "ARG",
    "FBT",
    "DTZ",
    "ICN",
    "PT",
    "D",
    "RUF",
    "A",
    "BLE",
    "EM",
    "FLY",
    "ISC",
    "PGH",
    "RSE",
    "SLF",
    "TRY",
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D203",   # Incompatible with D211 (no-blank-line-before-class)
    "D213",   # Incompatible with D212 (multi-line-summary-first-line)
    "ISC001", # Conflicts with ruff format (single-line implicit concat)
    "TRY003", # Conflicts with EM (long exception messages in raise)
    "PIE807", # Conflicts with pyright strict (lambda factories preserve type info)
    "PLW0108", # Conflicts with pyright strict (lambda factories preserve type info)
    "FBT001", # Union-typed value params are not boolean flags
    "FBT003", # Passing bool literals to union-typed params is not a boolean trap
    "S608",   # SQL constructed from constants, not user input
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 9

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Use of assert
    "SLF001", # Accessing private members in tests is fine
    "S603",   # Crash tests run our own helper script in a child process
]
"examples/**/*.py" = [
    "T201",   # Examples talk to the reader with print()
    "S603",   # The crash example runs itself as a child process
]
"src/pydb/executor.py" = [
    "PLR0911", # Dispatch function has many return statements by design
]
"src/pydb/query.py" = [
    "PLR0911", # Match on all operator variants requires many returns
]
"src/pydb/sql_parser.py" = [
    "PLR0911", # Dispatch function has many return statements by design
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--timeout=10",
    "--cov=src/pydb",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/_version.py",
    "*/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

# Pyright configuration
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
